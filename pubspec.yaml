  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.skalio.addressbook
        pluginClass: AddressbookPlugin
      ios:
        pluginClass: AddressbookPlugin
      macos:
        pluginClass: AddressbookPlugin